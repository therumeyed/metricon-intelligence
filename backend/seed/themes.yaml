  - slug: build-process-timelines
    name: Build process and timelines
    priority: 45
    rules: ['(build|building|construction) (process|time|timeline|stages?|steps)|how long (does|to|will)|time to build|construction stages|delays?|building contract|\bsteps to build']
    seed_keywords: [building process, how long to build a house, construction stages]
  - slug: styles-features
    name: Styles and features
    priority: 50
    rules: ['hamptons?|farmhouse|facades?|kitchens?|coastal|contemporary|modern|luxury|scandi|mediterranean|japandi|heritage|colonial|bathroom|alfresco|butler|walk[- ]in|outdoor living|vastu|sustainab|solar|energy efficient|smart home|style']
