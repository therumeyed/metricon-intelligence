  - slug: costs-affordability
    name: Costs and affordability
    priority: 40
    rules: ['\b(cost|costs|price|prices|pricing|cheap|cheapest|affordable|budget|how much|per square metre|per sqm|inclusions?|upgrades?|quote|fixed price)\b']
