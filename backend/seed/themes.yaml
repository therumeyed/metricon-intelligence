# Starting taxonomy (brief s5). Rules are cheap deterministic mappings applied to GSC query text,
# lowest priority number wins. Anything unmatched stays unmapped until reviewed (or batch-classified by Claude).
# 'seed_keywords' are the brief's candidate terms; they join representative GSC head terms as tracked keywords.
exclude_patterns:   # off-topic: rentals, decorating/maintenance how-tos, jobs, cleaning, unrelated property noise
  - '\brent(al|als|ing|er|ers)?\b(?!.*(to buy|to own))'
  - '\b(paint|painting|curtains?|blinds?|cleaning|cleaners?|plumber|electrician|jobs?|careers?|salary|recruitment)\b'
  - '\b(for sale by owner|real estate agents?|realestate|domain\.com|buy a house to flip)\b'
  - '\b(lego|minecraft|sims|bloxburg|roblox|game)\b'

themes:
  - slug: knockdown-rebuild
    name: Knockdown rebuild
    priority: 10
    rules: ['knock ?down|knockdown|rebuild|demolish|demolition|teardown|tear down']
    seed_keywords: [knockdown rebuild, knock down rebuild, knock down rebuild cost]
  - slug: dual-occupancy-duplex
    name: Dual occupancy and duplex
    priority: 11
    rules: ['dual[- ]?(occupancy|key|living)|duplex|two homes on one|semi[- ]detached|secondary dwelling|granny flat']
    seed_keywords: [dual occupancy, duplex builders, duplex designs, dual occupancy homes]
  - slug: townhouses
    name: Townhouses
    priority: 12
    rules: ['town ?(house|home)s?|townhomes?|terrace']
    seed_keywords: [townhouse builders, townhouse designs, townhouse prices]
  - slug: acreage
    name: Acreage
    priority: 13
    rules: ['acreage|rural (home|house|block)|country (home|house|living)|hobby farm|lifestyle (block|property)']
    seed_keywords: [acreage homes, acreage home designs]
  - slug: first-home-buyers-investors
    name: First-home buyers and investors
    priority: 20
    rules: ['first[- ]home|first time (home )?buyer|fhb|\bfhog\b|home buyer grant|investor|investment (property|home)|negative gearing|rent to buy']
    seed_keywords: [first home buyer, first home buyer grant, investment property builders]
  - slug: display-homes
    name: Display homes
    priority: 30
    rules: ['display (home|house|village|centre|center|suite)s?|show ?homes?|open for inspection|display villages?']
    seed_keywords: [display homes, display homes near me, display villages]
  - slug: house-and-land
    name: House and land
    priority: 31
    rules: ['(house|home)s? (and|&|\+) land|land (and|&) (house|home)|\bh ?& ?l\b|\bpackages?\b|\bestates?\b|land (for sale|releases?)|turnkey']
