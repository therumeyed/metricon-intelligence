# Launch roster (brief s3): 16 distinct brands, 22 brand/state assignments.
# Editable in the admin UI afterwards; this file only creates what is missing.
# Numeric positions that were pasted with the original competitor list are intentionally NOT imported.
states:
  VIC: {name: Victoria, main_city: Melbourne}
  NSW: {name: New South Wales, main_city: Sydney}
  QLD: {name: Queensland, main_city: Brisbane}
  SA: {name: South Australia, main_city: Adelaide}

